name: QuickBooks input desktop visibility test
on:
  push:
    branches: [qbo-isolation-check]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: windows-app-test
      - name: Watch real input desktop during official app startup and shutdown
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & node windows-app-test/visibility-test.mjs
