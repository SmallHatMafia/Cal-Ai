name: QuickBooks hidden-before-start control test
on:
  push:
    branches: [qbo-isolation-check]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: windows-app-test
      - name: Verify hidden policy on the same normal desktop
        shell: powershell
        env:
          QBO_CI_INTERACTIVE: '1'
          QBO_CI_HIDDEN_POLICY: '1'
        run: |
          $ErrorActionPreference='Stop'
          & node windows-app-test/visibility-test.mjs
